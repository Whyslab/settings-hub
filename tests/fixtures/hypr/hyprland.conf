
$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = ~/.local/share/rofi-launcher/bin/hub.sh
$browser = firefox

exec-once = hyprsunset
# Убираем стартовое предупреждение Hyprland про формат .conf
exec-once = ~/.config/hypr/scripts/dismiss-startup-notify.sh
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start screen-sleep-daemon.service
# Окно ввода пароля (hyprpolkitagent). Его служба привязана к graphical-session.target,
# а Hyprland из SDDM эту цель не поднимает — без этой строки агент после входа не
# стартует и любое действие с правами администратора молча висит. Одной цепочкой
# после передачи окружения: служба требует WAYLAND_DISPLAY и без него пропускается.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && systemctl --user start hyprpolkitagent.service

# Запускаем новый демон обоев
exec-once = awww-daemon
# Возвращаем обои рабочего стола после логина (скрипт сам дожидается демона)
exec-once = ~/.config/hypr/scripts/wallpaper.sh restore
# Панель через обёртку: она на лету дописывает календарю обновление даты.
# Без этого календарь застывает на дне запуска панели — см.
# ~/Documents/obsidian/01 Project/Панель/Календарь панели.md
exec-once = ~/.local/share/panel-refresh/hyprpanel-fresh.sh
# Поиск живёт в фоне, чтобы открываться мгновенно (SUPER+SHIFT+F).
exec-once = python3 ~/.local/share/spotlight/spotlight.py --daemon
# exec-once = hyprlock

# Слушатели буфера обмена (добавь к остальным exec-once)
# Они работают в фоне и запоминают текст и картинки
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

exec-once = [workspace 1 silent] firefox
# exec-once = [workspace 2 silent] spotify   # убран из автозапуска 2026-08-24
# Obsidian в фоне: без него правки с телефона (LiveSync) не попадают в файлы. 2026-09-23
exec-once = [workspace 2 silent] obsidian

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod SHIFT, R, exec, rofi -show drun   # запасной плоский список

bind = SUPER, escape, exec, wlogout --layout ~/.config/wlogout/layout --css ~/.config/wlogout/style.css -b 3 -L 200 -R 200 -T 120 -B 120

bind = SUPER SHIFT, N, exec, python3 ~/.local/share/screen-sleep/gui.py
# Таймер. Второе нажатие не поднимает второй, а показывает уже идущий.
bind = SUPER SHIFT, T, exec, python3 ~/.local/share/timer/timer.py
# Скорость интернета: два спидометра.
bind = SUPER SHIFT, I, exec, python3 ~/.local/share/netspeed/netspeed.py
# Поиск-остров: программы, файлы, заметки, интернет. Кнопка с лупой на панели
# делает то же. Раньше здесь была строка поиска ~/.local/share/websearch.
bind = SUPER SHIFT, F, exec, ~/.local/share/spotlight/toggle

# Ctrl + J: Открыть историю буфера через Rofi
bind = CTRL, J, exec, ~/.local/share/rofi-launcher/bin/hub-clipboard.sh

# Ctrl + D: Пипетка (цвет сразу копируется в буфер обмена в формате HEX)
bind = CTRL, D, exec, hyprpicker -a

# Скриншот выделенной области: экран сначала снимается целиком, потом замирает
# для выделения — поэтому тултипы и меню панели не пропадают (см. скрипт)
bind = SUPER SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh area
# Print: весь экран сразу, без выделения
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh screen

# Запуск браузера
bind = SUPER, F, exec, $browser

# Обои: Super+W — следующие по кругу, Super+Shift+W — выбрать через rofi
# (пикер меняет и фон блокировки, и фон экрана входа — три цели независимы)
bind = SUPER, W, exec, ~/.config/hypr/scripts/wallpaper.sh next
bind = SUPER SHIFT, W, exec, ~/.local/share/rofi-launcher/bin/hub-wallpaper.sh

# Управление громкостью (используется встроенный wpctl)
bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle       # Fn + F1 (Мут)
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # Fn + F2 (Тише)
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ # Fn + F3 (Громче)

# Голосовой ввод (Handy): клавиша с микрофоном (на HP без Fn) — начать запись, ещё раз — текст печатается в поле.
# Без SUPER намеренно: если печать начнётся при зажатом SUPER, буквы станут командами (SUPER+C закрывает окно).
# С 2026-10-20 Handy не в автозапуске (~0,6 ГБ памяти): первое нажатие запускает его, следующие — запись.
bind = ,XF86AudioMicMute, exec, ~/.config/hypr/scripts/handy-toggle.sh

# Управление яркостью
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%- # Fn + F5 (Темнее)
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+   # Fn + F6 (Светлее)

#ПЕРЕКЛЮЧЕНИЕ СТОЛОВ 

# Жесты (с 2026-10-25): три пальца вбок — прокрутка ленты окон, четыре — столы.
# До ленты столы листались тремя пальцами: `gesture = 3, horizontal, workspace`.
gesture = 3, horizontal, scrollMove
gesture = 4, horizontal, workspace

# Переключение между рабочими столами (Super + цифра)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Перемещение активного окна на нужный рабочий стол (Super + Shift + цифра)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Переключение на следующий/предыдущий стол по порядку (Win + PgUp/PgDn)
bind = SUPER, Page_Down, workspace, +1
bind = SUPER, Page_Up, workspace, -1

#ОКНА И ВЗАИМОДЕЙСТВИЕ С НИМИ 

# Win + Левая кнопка мыши: перемещение окна
bindm = SUPER, mouse:272, movewindow

# Win + Правая кнопка мыши: изменение размера окна
bindm = SUPER, mouse:273, resizewindow

# Цикличное переключение между открытыми окнами на текущем столе
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,

# Фокус на соседнее окно (Win + стрелки); лента сама прокручивается к нему
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Перемещение активного окна: влево/вправо — поменять местами с соседней
# колонкой ленты (movewindow в ленте не меняет местами, а кладёт окно в
# соседнюю колонку стопкой); вверх/вниз — внутри колонки
bind = SUPER SHIFT, left, layoutmsg, swapcol l
bind = SUPER SHIFT, right, layoutmsg, swapcol r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# Ширина окна в ленте (Win + Ctrl + ←/→): по кругу 1/2 → 2/3 → весь экран
bind = SUPER CTRL, left, layoutmsg, colresize -conf
bind = SUPER CTRL, right, layoutmsg, colresize +conf
# Развернуть/вернуть окно (Win + Ctrl + ↑), панель остаётся видна
bind = SUPER CTRL, up, fullscreen, 1

# Режим «как Windows» для текущего стола: все окна плавают, ещё раз — обратно в ленту
bind = SUPER SHIFT, V, exec, python3 ~/.config/hypr/scripts/winmode.py
# Список всех окон со всех столов с поиском (вместо «обзора» из Hyprstack)
bind = SUPER, Tab, exec, python3 ~/.config/hypr/scripts/windows.py
# exec (не exec-once) срабатывает на каждой перезагрузке конфига: reload стирает
# правило режима «как Windows», а превью анимаций в хабе делает reload постоянно
exec = python3 ~/.config/hypr/scripts/winmode.py --restore

general {
    # gaps_in: отступы МЕЖДУ окнами
    # gaps_out: отступы ОТ КРАЯ экрана
    gaps_in = 4
    gaps_out = 6
    
    border_size = 2
    col.active_border = rgba(333333ff) rgba(333333ff) 45deg
    col.inactive_border = rgba(111111ff)

    # Лента окон, как в niri (с 2026-10-25; до этого было dwindle — деление
    # экрана пополам). Окна стоят в ряд на всю высоту и не сжимаются, лента
    # прокручивается вбок. Одно окно на столе — на весь экран.
    layout = scrolling
}

scrolling {
    # Новое окно — 2/3 экрана: на 14″ с масштабом 1.5 половина слишком узкая
    column_width = 0.667
    explicit_column_widths = 0.5, 0.667, 1.0
    # Win+Shift+← на первом окне не перекидывает его в конец ленты
    wrap_swapcol = false
}

decoration {
    # Радиус скругления углов
    rounding = 12
    
    # Эффекты прозрачности
    active_opacity = 1.0
    inactive_opacity = 1.0

    # Блюр (размытие) для фона прозрачных окон
    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true
        ignore_opacity = true
    }
}

# Меню выключения (SUPER+ESC) — стекло с размытием, как у hyprlock.
# Namespace именно wlogout (см. strings /usr/bin/wlogout), не logout.
layerrule[namespace:wlogout] = blur true
layerrule[namespace:wlogout] = ignorezero true

# Поиск-остров (SUPER+SHIFT+F, кнопка на панели) — ~/.local/share/spotlight.
# Слой прозрачный и больше острова: ignore_alpha размывает только под самим
# островом, а не под тенью. Свою анимацию остров рисует сам — штатную выключаем.
layerrule = match:namespace ^(spotlight)$, blur true, ignore_alpha 0.5, no_anim true

#переключение русского языка и реверс тачпада
input {
  kb_layout = us,ru,no
  kb_options = grp:win_space_toggle
  touchpad {
      natural_scroll = true
   }
}
#Фикс для всех XWayland приложений (Включая Steam)
xwayland {
    force_zero_scaling = true
}

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
exec-once = hyprctl setcursor Bibata-Modern-Classic 24

#Без этого блока у вас гарантированно сломается или начнет сбоить важный функционал
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

# --- добавлено установщиком темы Monochrome Vivid ---
exec-once = hypridle

# Qwen-Max Wayland env
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland
env = SDL_VIDEODRIVER,wayland
env = ELECTRON_OZONE_PLATFORM,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# backup-manager hotkey
bind = SUPER SHIFT, B, exec, /opt/backup-manager/ui/rofi_menu.sh

# polkit authentication agent
# 12.09.2026: polkit-gnome 0.105 — пакет 2012 года, на Wayland открывал
# окно пароля без фокуса и за другими окнами. Заменён на родной для
# Hyprland hyprpolkitagent, он идёт своей службой systemd:
#   systemctl --user status hyprpolkitagent
# Откат: раскомментировать строку ниже и выключить ту службу.
# exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Спец-воркспейс sysmon — btop поверх текущего окна (SUPER+Ё)
# btop поднимается вместе с сессией и живёт скрытым в спец-воркспейсе, чтобы к
# первому SUPER+Ё графики уже были заполнены историей, а не начинались с нуля.
# Ключевое слово silent — внутри скрипта; без него окно выскочило бы при логине.
exec-once = ~/.config/hypr/scripts/sysmon.sh start
# code:49 — физическая клавиша под Esc, привязка по коду не зависит от раскладки.
bind = SUPER, code:49, exec, ~/.config/hypr/scripts/sysmon.sh

# Здесь была ещё привязка SUPER SHIFT code:49 → movetoworkspace special:sysmon.
# Убрана 26.08.2026: отправленное туда окно начинало жить вместе с btop —
# пропадало и всплывало поверх всего вместе с ним, а вернуть его было нечем.
# Спец-воркспейс держим только под btop.

# Отдельный класс btop-scratch, чтобы правила не задели обычные kitty по SUPER+Q.
# Синтаксис 0.56: одна строка = список пар «поле значение» через запятую,
# матчеры с префиксом match:. Скобки [] задают ИМЯ правила, а не матчер.
# Размер только выражением: «size 90% 90%» тут молча игнорируется.
# 0.9, а не 0.78: при 0.78 в окно влезало 23 строки, а btop требует минимум 24.
windowrule = match:class ^(btop-scratch)$, float true, size monitor_w*0.9 monitor_h*0.9, center true, workspace special:sysmon

# Распад окна на пиксели при закрытии — плагин hypr-dissolve.
# Исходники и README: ~/Projects/hypr-dissolve (github.com/Whyslab/hypr-dissolve).
# ВАЖНО: плагин привязан к конкретной сборке Hyprland. После обновления пакета
# hyprland его надо пересобрать: cd ~/Projects/hypr-dissolve && ./install.sh
# Сессию это не уронит — при несовпадении версий плагин откажется грузиться и
# скажет об этом уведомлением, анимация просто пропадёт до пересборки.
plugin = ~/Projects/hypr-dissolve/build/hypr-dissolve.so

# Не отдавать зажатый Esc окну, которое получает фокус. Без этого закрытие rofi
# по Esc выбивало Firefox из полноэкранного видео: композитор сообщает новому
# окну список зажатых клавиш, а Firefox читает Escape оттуда как нажатие.
# Обычные нажатия Esc идут другим путём и работают как работали.
plugin:dissolve:key_leak_fix = 1

# Длительность распада берётся из fadeOut: плагин считает прогресс по альфе.
# 15 = 1.5 с (по умолчанию было 0.8 с — наследовалось от global).
# windowsOut той же длины, иначе геометрия успевала отработать раньше и окно
# замирало, пока пиксели ещё летели. popin 100% = окно не сжимается: оно стоит
# на месте, улетают только пиксели.
# Больше эти ветки ни на что не влияют — переключение столов идёт от global.
# Слои (rofi и прочие меню на layer-shell) идут по своей ветке анимаций: ни
# fadeOut, ни windowsOut на них не действуют. Длительность та же, 1.5 с.
# Анимации живут в отдельном файле: его переписывает раздел «Анимации» в хабе
# (SUPER+R → Анимации). Руками не править — при следующем выборе пресета
# правки исчезнут. Пресеты лежат в ~/Projects/rofi-launcher/data/presets/.
source = ~/.config/hypr/animations.conf

# Тестовое окно для живого превью анимаций (Ctrl+Пробел в сетке пресетов).
windowrule = match:class ^(anim-preview)$, float true, size 600 400, center true

# Таймер: маленькое окно, которое незачем тянуть на весь экран.
windowrule = match:class ^(timer)$, float true, center true
windowrule = match:class ^(netspeed)$, float true, center true
# Строка поиска: плавающая, по центру и чуть выше середины — ниже её
# закрывал бы взгляд на то, что под ней. Таскается SUPER и мышью.
windowrule = match:class ^(websearch)$, float true, center true
source = ~/.local/state/wallpaper-theme/hyprland.conf  # wallpaper-theme
