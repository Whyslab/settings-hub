[project]
name = "settings-hub"
version = "0.1.0"
description = "A macOS-style settings window for a Hyprland desktop (GTK4 + Python)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = [
    "live: reads the real modules and configs of this machine (run locally: pytest -m live)",
]
